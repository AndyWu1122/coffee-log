<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- CSP：只允許自己的網域和 Supabase（js/config.js 的 LOCAL 與 PRODUCTION）；正式專案建立後要把它的網址加進 img-src、connect-src
       style-src-attr：風味標籤的顏色寫在 style 屬性裡（顏色來自 App 自己的風味輪資料） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob: https://rygsjrzddhhhdqpoayoa.supabase.co http://127.0.0.1:54321; connect-src 'self' https://rygsjrzddhhhdqpoayoa.supabase.co http://127.0.0.1:54321; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d14">
  <meta name="description" content="記錄手沖咖啡沖煮參數與風味">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="手沖紀錄">
  <title>手沖紀錄</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 id="page-title">手沖紀錄</h1>
    <!-- 不常調整的設定放在這個選單，不加到底部分頁列；☰ 上的「!」＝收到好友邀請（app.js 的 setupBadges） -->
    <div class="menu">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="選單"
        aria-haspopup="menu" aria-expanded="false" aria-controls="app-menu">☰<span class="notify-badge"
        id="request-badge" aria-hidden="true" hidden>!</span></button>
      <div class="menu-list" id="app-menu" role="menu" hidden>
        <!-- 咖啡社群：js/config.js 有設定才顯示（app.js 的 setupMenu） -->
        <a role="menuitem" href="#/account" data-social hidden><span aria-hidden="true">👤</span>帳號</a>
        <a role="menuitem" href="#/friends" data-social hidden><span aria-hidden="true">🤝</span>好友管理</a>
        <div class="menu-sep" role="separator" data-social hidden></div>
        <a role="menuitem" href="#/grinders"><span aria-hidden="true">⚙️</span>磨豆機</a>
        <a role="menuitem" href="#/backup"><span aria-hidden="true">💾</span>備份</a>
        <a role="menuitem" href="#/privacy"><span aria-hidden="true">🔒</span>隱私說明</a>
        <!-- 意見回饋：要登入才能送（防灌送），js/config.js 沒設定時不顯示 -->
        <a role="menuitem" href="#/feedback" data-social hidden><span aria-hidden="true">💬</span>意見回饋</a>
        <div class="menu-sep" role="separator"></div>
        <div class="menu-theme" role="group" aria-labelledby="theme-label">
          <span class="menu-label" id="theme-label"><span aria-hidden="true">🌓</span>外觀</span>
          <div class="theme-options">
            <button type="button" role="menuitemradio" data-theme-pref="auto" aria-checked="false">自動</button>
            <button type="button" role="menuitemradio" data-theme-pref="light" aria-checked="false">淺色</button>
            <button type="button" role="menuitemradio" data-theme-pref="dark" aria-checked="false">深色</button>
          </div>
        </div>
        <!-- 版本號＝sw.js 的 APP_VERSION（app.js 向 Service Worker 詢問）；沒有 Service Worker 時不顯示 -->
        <div class="menu-version" id="app-version" hidden></div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar" aria-label="主選單">
    <a href="#/" data-tab="brews">
      <span class="tab-icon" aria-hidden="true">☕</span>紀錄
    </a>
    <a href="#/beans" data-tab="beans">
      <span class="tab-icon" aria-hidden="true">🫘</span>豆子
    </a>
    <a href="#/feed" data-tab="feed" data-social hidden>
      <span class="tab-icon" aria-hidden="true">👥<span class="notify-badge notify-badge-new" id="feed-badge" hidden>!</span></span>好友
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="update-banner" class="update-banner" role="alert" hidden>
    <span>有新版本可用</span>
    <button type="button" class="btn btn-primary" id="update-btn">更新</button>
  </div>
</body>
</html>
