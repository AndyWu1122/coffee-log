<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d14">
  <meta name="description" content="記錄手沖咖啡沖煮參數與風味">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="手沖紀錄">
  <title>手沖紀錄</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // 在畫面畫出前套用主題，避免先閃一下另一個主題
    // 偏好（auto/light/dark）存 localStorage：只是這支手機的顯示偏好，需要同步讀取（見 CLAUDE.md）
    // 切換邏輯在 js/app.js 的 setupTheme()，兩邊的判斷要一致
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('theme') || 'auto'; } catch (e) {}
      var light = pref === 'light' || (pref !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.querySelector('meta[name="theme-color"]').content = light ? '#ffffff' : '#2b1d14';
      // iPhone 主畫面 App 的狀態列：淺色主題要深色字
      document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = light ? 'default' : 'black-translucent';
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 id="page-title">手沖紀錄</h1>
    <!-- 不常調整的設定放在這個選單，不加到底部分頁列 -->
    <div class="menu">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="選單"
        aria-haspopup="menu" aria-expanded="false" aria-controls="app-menu">☰</button>
      <div class="menu-list" id="app-menu" role="menu" hidden>
        <a role="menuitem" href="#/grinders"><span aria-hidden="true">⚙️</span>磨豆機</a>
        <a role="menuitem" href="#/backup"><span aria-hidden="true">💾</span>備份</a>
        <div class="menu-sep" role="separator"></div>
        <div class="menu-theme" role="group" aria-labelledby="theme-label">
          <span class="menu-label" id="theme-label"><span aria-hidden="true">🌓</span>外觀</span>
          <div class="theme-options">
            <button type="button" role="menuitemradio" data-theme-pref="auto" aria-checked="false">自動</button>
            <button type="button" role="menuitemradio" data-theme-pref="light" aria-checked="false">淺色</button>
            <button type="button" role="menuitemradio" data-theme-pref="dark" aria-checked="false">深色</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar" aria-label="主選單">
    <a href="#/" data-tab="brews">
      <span class="tab-icon" aria-hidden="true">☕</span>紀錄
    </a>
    <a href="#/beans" data-tab="beans">
      <span class="tab-icon" aria-hidden="true">🫘</span>豆子
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="update-banner" class="update-banner" role="alert" hidden>
    <span>有新版本可用</span>
    <button type="button" class="btn btn-primary" id="update-btn">更新</button>
  </div>
</body>
</html>
