<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- CSP：只允許自己的網域和正式的 Supabase（js/config.js 的 PRODUCTION；改網址時 img-src、connect-src 要一起改）
       本機 Supabase（config.js 的 LOCAL）不放在這裡：測試用的靜態伺服器（scripts/chrome.mjs）送出這個檔案時才加上
       style-src-attr：風味標籤的顏色寫在 style 屬性裡（顏色來自 App 自己的風味輪資料） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob: https://rygsjrzddhhhdqpoayoa.supabase.co; connect-src 'self' https://rygsjrzddhhhdqpoayoa.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d14">
  <meta name="description" content="記錄手沖咖啡沖煮參數與風味">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="手沖紀錄">
  <title>手沖紀錄</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 id="page-title">手沖紀錄</h1>
    <!-- 不常調整的設定放在這個選單，不加到底部分頁列
         ☰ 上的「!」＝選單裡有任何一項有「!」（.menu-alert：好友邀請、該備份了、還沒看過的更新內容；app.js 的 setupBadges） -->
    <div class="menu">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="選單"
        aria-haspopup="menu" aria-expanded="false" aria-controls="app-menu">☰<span class="notify-badge"
        id="menu-badge" aria-hidden="true" hidden>!</span></button>
      <div class="menu-list" id="app-menu" role="menu" hidden>
        <!-- 咖啡社群：js/config.js 有設定才顯示（app.js 的 setupMenu） -->
        <a role="menuitem" href="#/account" data-social hidden><span aria-hidden="true">👤</span>帳號</a>
        <a role="menuitem" href="#/friends" data-social hidden><span aria-hidden="true">🤝</span>好友管理<span
          class="menu-alert" data-alert="friends" aria-hidden="true" hidden>!</span></a>
        <div class="menu-sep" role="separator" data-social hidden></div>
        <a role="menuitem" href="#/stats"><span aria-hidden="true">📊</span>統計</a>
        <a role="menuitem" href="#/grinders"><span aria-hidden="true">⚙️</span>磨豆機</a>
        <a role="menuitem" href="#/drippers"><span aria-hidden="true">☕</span>濾杯</a>
        <a role="menuitem" href="#/backup"><span aria-hidden="true">💾</span>備份<span
          class="menu-alert" data-alert="backup" aria-hidden="true" hidden>!</span></a>
        <a role="menuitem" href="#/privacy"><span aria-hidden="true">🔒</span>隱私說明</a>
        <a role="menuitem" href="#/changelog"><span aria-hidden="true">✨</span>更新內容<span
          class="menu-alert" data-alert="changelog" aria-hidden="true" hidden>!</span></a>
        <!-- 意見回饋：要登入才能送（防灌送），js/config.js 沒設定時不顯示 -->
        <a role="menuitem" href="#/feedback" data-social hidden><span aria-hidden="true">💬</span>意見回饋</a>
        <!-- 開發者後台：只有開發者看得到入口（app.js 問資料庫 am_i_admin）；真正的權限在資料庫與 Edge Function -->
        <a role="menuitem" href="#/admin" data-admin hidden><span aria-hidden="true">🛠️</span>開發者後台</a>
        <div class="menu-sep" role="separator"></div>
        <div class="menu-theme" role="group" aria-labelledby="theme-label">
          <span class="menu-label" id="theme-label"><span aria-hidden="true">🌓</span>外觀</span>
          <div class="theme-options">
            <button type="button" role="menuitemradio" data-theme-pref="auto" aria-checked="false">自動</button>
            <button type="button" role="menuitemradio" data-theme-pref="light" aria-checked="false">淺色</button>
            <button type="button" role="menuitemradio" data-theme-pref="dark" aria-checked="false">深色</button>
          </div>
        </div>
        <!-- 版本號＝sw.js 的 APP_VERSION（app.js 向 Service Worker 詢問）；沒有 Service Worker 時不顯示；點了到更新內容 -->
        <div class="menu-version" id="app-version" hidden><a role="menuitem" href="#/changelog"></a></div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar" aria-label="主選單">
    <a href="#/" data-tab="brews">
      <span class="tab-icon" aria-hidden="true">☕</span>紀錄
    </a>
    <a href="#/beans" data-tab="beans">
      <span class="tab-icon" aria-hidden="true">🫘</span>豆子
    </a>
    <!-- 社群：數字＝好友新貼文＋我貼文的新留言＋回覆我的（app.js 的 setupBadges） -->
    <a href="#/social" data-tab="social" data-social hidden>
      <span class="tab-icon" aria-hidden="true">💬<span class="notify-badge notify-badge-new" id="social-badge" hidden></span></span>社群
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="update-banner" class="update-banner" role="alert" hidden>
    <span>有新版本可用</span>
    <button type="button" class="btn btn-primary" id="update-btn">更新</button>
  </div>

  <!-- 更新完、還沒看過這一版的更新內容時顯示（app.js 的 setupBadges）；「有新版本可用」出現時先讓它 -->
  <div id="updated-banner" class="update-banner" role="status" hidden>
    <span id="updated-text">已更新到新版本</span>
    <span class="update-actions">
      <a class="btn btn-primary" href="#/changelog" id="updated-link">看看改了什麼</a>
      <button type="button" class="btn" id="updated-close" aria-label="關閉，不用看">✕</button>
    </span>
  </div>
</body>
</html>
